<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sourdough Calculator · Smirking Cat Software</title>
    <link rel="icon" href="/public/images/smirk-cat.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/css/theme.css" />
    <link rel="stylesheet" href="/src/styles/calculator.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header no-print">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="/public/images/smirk-cat.png" alt="" width="60" height="60" />
          </div>
          <div class="brand-text">
            <p class="brand-title">Smirking Cat Software</p>
            <p class="brand-subtitle">Flour first, then water</p>
          </div>
        </div>
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/">All apps</a>
        </nav>
      </header>

      <main>
        <section class="hero no-print">
          <h1>Sourdough Calculator</h1>
          <p>
            Baker&apos;s percentages for a levain loaf — set flour, hydration, salt, and
            levain; get grams for the preferment and final dough.
          </p>
        </section>

        <section class="card no-print" aria-labelledby="inputs-heading">
          <h2 id="inputs-heading" class="card-heading">Parameters</h2>
          <form id="calculator-form">
            <div class="form-grid">
              <label>
                Total flour (g)
                <input
                  type="number"
                  name="totalFlourG"
                  min="1"
                  max="20000"
                  step="1"
                  value="510"
                />
                <span class="field-hint">Baker&apos;s 100% — all flour in the loaf</span>
              </label>
              <label>
                Hydration (%)
                <input
                  type="number"
                  name="hydrationPct"
                  min="50"
                  max="120"
                  step="0.5"
                  value="80"
                />
                <span class="field-hint">Total water as % of flour</span>
              </label>
              <label>
                Salt (%)
                <input
                  type="number"
                  name="saltPct"
                  min="0"
                  max="5"
                  step="0.1"
                  value="2"
                />
                <span class="field-hint">Of total flour</span>
              </label>
              <label>
                Levain (%)
                <input
                  type="number"
                  name="levainPct"
                  min="0"
                  max="50"
                  step="0.5"
                  value="12"
                />
                <span class="field-hint">Preferment flour as % of total flour</span>
              </label>
            </div>
          </form>
        </section>

        <section class="card card--results" aria-labelledby="results-heading">
          <h2 id="results-heading" class="card-heading">Calculated weights</h2>
          <div id="results"></div>
        </section>
      </main>

      <footer class="site-footer no-print">
        <p>Weights only — bake by feel after that.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
